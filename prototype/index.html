<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WIW - Work in Web</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/icons.css">
    <link rel="icon" type="image/png" href="../frontend/public/favicon.png">
</head>
<body>
    <!-- Navigation -->
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo">W</div>
            <span class="logo-text">WiW AE+</span>
        </div>
        
        <ul class="nav-menu" id="navMenu">
            <li><a href="#dashboard" class="nav-link active" data-page="dashboard">
                <span class="icon" data-icon="dashboard"></span> Tableau de Bord
            </a></li>
            <li><a href="#honoraires" class="nav-link" data-page="honoraires">
                <span class="icon" data-icon="money"></span> Honoraires
            </a></li>
            <li><a href="#tenders" class="nav-link" data-page="tenders">
                <span class="icon" data-icon="clipboard"></span> Appels d'Offres
            </a></li>
            <li><a href="#team" class="nav-link" data-page="team">
                <span class="icon" data-icon="users"></span> Équipe
            </a></li>
            <li><a href="#company" class="nav-link" data-page="company">
                <span class="icon" data-icon="building"></span> Clients
            </a></li>
            <li><a href="#devis" class="nav-link" data-page="devis">
                <span class="icon" data-icon="document"></span> Devis
            </a></li>
            <li><a href="#analytics" class="nav-link" data-page="analytics">
                <span class="icon" data-icon="chart"></span> Analytics
            </a></li>
            <li><a href="#references" class="nav-link" data-page="references">
                <span class="icon" data-icon="star"></span> Références
            </a></li>
            <li><a href="#settings" class="nav-link" data-page="settings">
                <span class="icon" data-icon="settings"></span> Paramètres
            </a></li>
        </ul>
        
        <div class="sidebar-footer">
            <button class="theme-toggle" id="themeToggle" title="Changer le thème">
                <span class="icon" id="themeIcon"></span> <span id="themeLabel">Mode sombre</span>
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content" id="mainContent">
        <div class="page-header">
            <h1 id="pageTitle">Tableau de Bord</h1>
            <div class="header-actions">
                <button class="btn btn-primary" id="addBtn">+ Ajouter</button>
            </div>
        </div>

        <!-- Page Content -->
        <div class="page-content" id="pageContent">
            <!-- Le contenu sera injecté dynamiquement -->
        </div>
    </main>

    <!-- Mobile Menu Toggle -->
    <button class="mobile-menu-toggle" id="mobileMenuToggle">
        <span class="icon-menu" data-icon="menu"></span>
    </button>

    <script src="js/icons.js"></script>
    <script src="js/data/seed.js"></script>
    <script src="js/app.js"></script>
    <script src="js/pages/dashboard.js"></script>
    <script src="js/pages/honoraires.js"></script>
    <script src="js/pages/tenders.js"></script>
    <script src="js/pages/team.js"></script>
    <script src="js/pages/company.js"></script>
    <script src="js/pages/devis.js"></script>
    <script src="js/pages/analytics.js"></script>
    <script src="js/pages/references.js"></script>
    <script src="js/pages/settings.js"></script>
    
    <script>
        // Initialiser les icônes après chargement
        document.addEventListener('DOMContentLoaded', () => {
            // Remplacer les icônes dans le menu
            const iconElements = document.querySelectorAll('[data-icon]');
            iconElements.forEach(el => {
                const iconName = el.getAttribute('data-icon');
                if (iconName && typeof getIcon === 'function') {
                    el.innerHTML = getIcon(iconName);
                }
            });
        });
        
        // Initialiser les données de test si localStorage est vide
        if (!localStorage.getItem('wiw-projets')) {
            console.log('Pour initialiser les données de test, exécutez: seedData()');
        }
    </script>
</body>
</html>
