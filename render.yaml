# Render Blueprint - WIW-AE+ Monorepo
# Documentation: https://render.com/docs/blueprint-spec

services:
  # Backend API - Node.js Web Service
  - type: web
    name: wiw-ae-backend
    runtime: node
    region: frankfurt
    plan: starter
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: wiw-ae-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        fromService:
          type: web
          name: wiw-ae-frontend
          property: host
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: wiw-ae-frontend
          property: host

  # Frontend - Static Site (Vite/React)
  - type: web
    name: wiw-ae-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: wiw-ae-backend
          property: host

databases:
  # PostgreSQL Database
  - name: wiw-ae-db
    region: frankfurt
    plan: basic-1gb
    databaseName: wiw_ae_production
    user: wiw_admin
    postgresMajorVersion: 15
