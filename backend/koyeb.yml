version: '1.0'

services:
  - name: wiw-backend
    image:
      # If you prefer to use Koyeb's registry, build from this repo by connecting GitHub.
      # For local builds, push the above Dockerfile to a registry and reference the image here.
      # Example: registry.koyeb.com/<your-namespace>/wiw-backend:latest
      repository: ""
    deploy:
      strategy: Rolling
      env:
        - name: PORT
          value: "4000"
        - name: NODE_ENV
          value: "production"
        - name: DATABASE_URL
          value: "${DATABASE_URL}"
        - name: JWT_SECRET
          value: "${JWT_SECRET}"
    build:
      # If you connect the repo in Koyeb UI, Koyeb will build from the Dockerfile.
      dockerfile: Dockerfile
      context: .
    ports:
      - port: 4000
        protocol: tcp
    health_check:
      path: /api/ready
      interval: 10
      timeout: 10
      healthy_threshold: 2
      unhealthy_threshold: 3
