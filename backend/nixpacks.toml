# Configuration Nixpacks pour forcer l'utilisation de Nixpacks
# Railway détectera ce fichier et utilisera Nixpacks au lieu de Dockerfile

# Laisser Nixpacks détecter Node.js automatiquement
# npm est inclus avec nodejs_18, ne pas le spécifier séparément

[phases.install]
cmds = ["npm install"]

[phases.build]
# Provide a safe fallback for Prisma during build so generation doesn't fail
# when DATABASE_URL isn't defined in the build environment. Runtime environments
# should override DATABASE_URL with the real connection string.
cmds = ["DATABASE_URL=${DATABASE_URL:-file:./dev.db} npx prisma generate"]

[start]
cmd = "npm start"

