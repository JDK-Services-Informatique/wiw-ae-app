# Configuration Nixpacks pour forcer l'utilisation de Nixpacks
# Railway détectera ce fichier et utilisera Nixpacks au lieu de Dockerfile

# Laisser Nixpacks détecter Node.js automatiquement
# npm est inclus avec nodejs_18, ne pas le spécifier séparément

[phases.install]
cmds = ["npm install"]

[phases.build]
cmds = ["npx prisma generate", "npx prisma migrate deploy"]

[start]
cmd = "npm start"

