name: CI/CD Pipeline (Désactivé)

# ⚠️ WORKFLOW DÉSACTIVÉ - Render gère le déploiement automatiquement
# Pour réactiver, changez "workflow_dispatch:" en "push:" et "pull_request:"

# Workflow optimisé pour réduire la consommation de minutes GitHub Actions
# Les tests et builds sont limités aux cas critiques uniquement

on:
  # DÉSACTIVÉ : Ne s'exécute plus automatiquement
  # push:
  #   branches: [ main ]
  #   paths-ignore:
  #     - '**.md'
  #     - 'LICENSE'
  #     - '.gitignore'
  # pull_request:
  #   branches: [ main ]
  #   paths-ignore:
  #     - '**.md'
  #     - 'LICENSE'
  #     - '.gitignore'
  
  # UNIQUEMENT sur demande manuelle (workflow_dispatch)
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Exécuter les tests'
        required: false
        default: false
        type: boolean
      run_build:
        description: 'Exécuter le build'
        required: false
        default: false
        type: boolean
      deploy_to_render:
        description: 'Déployer sur Render via API (nécessite secrets)'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '18.x'

jobs:
  # Tests Frontend - Uniquement sur demande manuelle
  test-frontend:
    name: Tests Frontend (Rapides)
    runs-on: ubuntu-latest
    # Ne s'exécute que si demandé manuellement
    if: github.event.inputs.run_tests == 'true'
    defaults:
      run:
        working-directory: ./frontend
    timeout-minutes: 10  # Limite de temps
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      # Tests unitaires uniquement (rapides)
      - name: Run unit tests
        run: npm test -- --run --reporter=verbose
        continue-on-error: true
      
      # E2E désactivé pour économiser les minutes
      # - name: Run E2E tests
      #   run: npm run test:e2e || true

  # Build Frontend - Uniquement sur demande manuelle
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    # Uniquement si demandé manuellement
    if: github.event.inputs.run_build == 'true'
    defaults:
      run:
        working-directory: ./frontend
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build application
        run: npm run build
        # Note: Les variables d'environnement VITE_* sont définies au moment du déploiement
        # Le build fonctionne sans elles car elles sont utilisées à l'exécution, pas au build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist
          retention-days: 3  # Réduit de 7 à 3 jours

  # Tests Backend - Désactivés pour économiser les minutes
  # Les tests backend peuvent être exécutés localement ou sur Render

  # Build Backend - Désactivé (Render gère le build)
  # Le backend est buildé directement sur Render via le Blueprint

  # Déploiement - Optionnel via API Render
  deploy:
    name: Deploy to Render (Optionnel)
    runs-on: ubuntu-latest
    needs: [build-frontend]
    if: github.event.inputs.run_build == 'true' && github.event.inputs.deploy_to_render == 'true'
    timeout-minutes: 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to Render via API
        if: env.RENDER_API_KEY != '' && env.RENDER_SERVICE_ID != ''
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "⚠️ RENDER_API_KEY ou RENDER_SERVICE_ID non configurés"
            echo "Le déploiement se fera automatiquement via Render Blueprint"
            exit 0
          fi
          
          echo "🚀 Déclenchement du déploiement via API Render..."
          
          RESPONSE=$(curl -s --request POST \
            --url "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            --header 'Accept: application/json' \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header 'Content-Type: application/json' \
            --data '{"clearCache": false}')
          
          DEPLOY_ID=$(echo $RESPONSE | jq -r '.deploy.id // empty')
          
          if [ -n "$DEPLOY_ID" ] && [ "$DEPLOY_ID" != "null" ]; then
            echo "✅ Déploiement déclenché : $DEPLOY_ID"
            echo "📊 Suivre : https://dashboard.render.com/web/services/${RENDER_SERVICE_ID}/deploys/${DEPLOY_ID}"
          else
            echo "⚠️ Erreur lors du déploiement via API"
            echo "$RESPONSE" | jq '.' || echo "$RESPONSE"
            echo "Le déploiement se fera automatiquement via Render Blueprint"
          fi
      
      - name: Deploy Notification (Blueprint)
        if: env.RENDER_API_KEY == '' || env.RENDER_SERVICE_ID == ''
        run: |
          echo "✅ Build terminé - Déploiement géré par Render Blueprint"
          echo "Le déploiement sur Render se fait automatiquement via le Blueprint"
          echo "ou via webhook GitHub si configuré"

