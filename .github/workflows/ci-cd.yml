name: CI/CD Pipeline (Désactivé)

# ⚠️ WORKFLOW DÉSACTIVÉ - Render gère le déploiement automatiquement
# Pour réactiver, changez "workflow_dispatch:" en "push:" et "pull_request:"

# Workflow optimisé pour réduire la consommation de minutes GitHub Actions
# Les tests et builds sont limités aux cas critiques uniquement

on:
  # DÉSACTIVÉ : Ne s'exécute plus automatiquement
  # push:
  #   branches: [ main ]
  #   paths-ignore:
  #     - '**.md'
  #     - 'LICENSE'
  #     - '.gitignore'
  # pull_request:
  #   branches: [ main ]
  #   paths-ignore:
  #     - '**.md'
  #     - 'LICENSE'
  #     - '.gitignore'
  
  # UNIQUEMENT sur demande manuelle (workflow_dispatch)
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Exécuter les tests'
        required: false
        default: false
        type: boolean
      run_build:
        description: 'Exécuter le build'
        required: false
        default: false
        type: boolean
      deploy_to_render:
        description: 'Déployer sur Render via API (nécessite secrets)'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '18.x'

jobs:
  # Tests Frontend - Uniquement sur demande manuelle
  test-frontend:
    name: Tests Frontend (Rapides)
    runs-on: ubuntu-latest
    # Ne s'exécute que si demandé manuellement
    if: github.event.inputs.run_tests == 'true'
    defaults:
      run:
        working-directory: ./frontend
    timeout-minutes: 10  # Limite de temps
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      # Tests unitaires uniquement (rapides)
      - name: Run unit tests
        run: npm test -- --run --reporter=verbose
        continue-on-error: true
      
      # E2E désactivé pour économiser les minutes
      # - name: Run E2E tests
      #   run: npm run test:e2e || true

  # Build Frontend - Uniquement sur demande manuelle
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    # Uniquement si demandé manuellement
    if: github.event.inputs.run_build == 'true'
    defaults:
      run:
        working-directory: ./frontend
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build application
        run: npm run build
        # Note: Les variables d'environnement VITE_* sont définies au moment du déploiement
        # Le build fonctionne sans elles car elles sont utilisées à l'exécution, pas au build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist
          retention-days: 3  # Réduit de 7 à 3 jours

  # Tests Backend - Désactivés pour économiser les minutes
  # Les tests backend peuvent être exécutés localement ou sur Render

  # Build Backend - Désactivé (Railway gère le build)
  # Le backend est buildé directement sur Railway automatiquement

  # Déploiement - Géré automatiquement par Railway
  # Railway déploie automatiquement à chaque push sur la branche principale
      

