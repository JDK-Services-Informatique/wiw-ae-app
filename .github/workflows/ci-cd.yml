name: CI/CD Pipeline (Optimisé)

# Workflow optimisé pour réduire la consommation de minutes GitHub Actions
# Les tests et builds sont limités aux cas critiques uniquement

on:
  push:
    branches: [ main ]
    # Ignorer les modifications de documentation uniquement
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  # Permettre l'exécution manuelle
  workflow_dispatch:

env:
  NODE_VERSION: '18.x'

jobs:
  # Tests Frontend - Uniquement sur main et PR
  test-frontend:
    name: Tests Frontend (Rapides)
    runs-on: ubuntu-latest
    # Ne s'exécute que sur main ou PR
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: ./frontend
    timeout-minutes: 10  # Limite de temps
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      # Tests unitaires uniquement (rapides)
      - name: Run unit tests
        run: npm test -- --run --reporter=verbose
        continue-on-error: true
      
      # E2E désactivé pour économiser les minutes
      # - name: Run E2E tests
      #   run: npm run test:e2e || true

  # Build Frontend - Uniquement sur main
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    # Uniquement sur main pour le déploiement
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: ./frontend
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build application
        run: npm run build
        # Note: Les variables d'environnement VITE_* sont définies au moment du déploiement
        # Le build fonctionne sans elles car elles sont utilisées à l'exécution, pas au build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist
          retention-days: 3  # Réduit de 7 à 3 jours

  # Tests Backend - Désactivés pour économiser les minutes
  # Les tests backend peuvent être exécutés localement ou sur Render

  # Build Backend - Désactivé (Render gère le build)
  # Le backend est buildé directement sur Render via le Blueprint

  # Déploiement - Uniquement notification (Render gère le déploiement)
  deploy:
    name: Deploy Notification
    runs-on: ubuntu-latest
    needs: [build-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 2
    
    steps:
      - name: Deploy to Render
        run: |
          echo "✅ Build terminé - Déploiement géré par Render Blueprint"
          echo "Le déploiement sur Render se fait automatiquement via le Blueprint"
          echo "ou via webhook GitHub si configuré"

